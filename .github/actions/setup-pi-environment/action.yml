name: 'Setup Pi Environment'
description: 'Install and configure Pi coding agent globally using pi-action SDK'
author: 'Patchani Team'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  pi-version:
    description: 'Pi version to install'
    required: false
    default: 'latest'
  anthropic-api-key:
    description: 'Anthropic API key for Pi'
    required: false
    default: ''

outputs:
  pi-version:
    description: 'Installed Pi version'
    value: ${{ steps.install.outputs.version }}
  pi-path:
    description: 'Path to Pi executable'
    value: ${{ steps.install.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install Pi globally
      id: install
      shell: bash
      run: |
        echo "Installing Pi coding agent globally..."
        npm install -g @earendil-works/pi-coding-agent@${{ inputs.pi-version }}
        
        # Get installed version
        PI_VERSION=$(pi --version 2>&1 | head -n 1 || echo "unknown")
        echo "version=${PI_VERSION}" >> $GITHUB_OUTPUT
        
        # Get Pi path
        PI_PATH=$(which pi || echo "pi")
        echo "path=${PI_PATH}" >> $GITHUB_OUTPUT
        
        echo "✓ Pi installed: ${PI_VERSION}"
        echo "✓ Location: ${PI_PATH}"

    - name: Configure Pi
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        echo "Configuring Pi environment..."
        
        # Create Pi config directory
        mkdir -p ~/.pi/agent
        
        # Set API key if provided
        if [ -n "${ANTHROPIC_API_KEY}" ]; then
          echo "✓ API key configured"
        else
          echo "⚠ No API key provided - set ANTHROPIC_API_KEY for full functionality"
        fi
        
        # Verify installation
        if pi --version >/dev/null 2>&1; then
          echo "✓ Pi installation verified"
        else
          echo "✗ Pi installation verification failed"
          exit 1
        fi

    - name: Display Pi info
      shell: bash
      run: |
        echo "=== Pi Environment Info ==="
        echo "Pi version: $(pi --version 2>&1 | head -n 1)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Pi location: $(which pi)"
        echo "=========================="

branding:
  icon: 'terminal'
  color: 'blue'
