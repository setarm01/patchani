name: 'Upload Test Logs'
description: 'Upload test logs and artifacts with retention policy, always runs even on failure'
author: 'patchani'

inputs:
  artifact-name:
    description: 'Name for the uploaded artifact (must be unique per workflow run)'
    required: true
  log-path:
    description: 'Path pattern for log files to upload (e.g., "*.log" or "test-install/*.log")'
    required: false
    default: '*.log'
  retention-days:
    description: 'Number of days to retain artifacts (1-90)'
    required: false
    default: '7'

runs:
  using: 'composite'
  steps:
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.log-path }}
        retention-days: ${{ inputs.retention-days }}
