name: PR to Main - Full Test Suite

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: '20'

      - name: Run unit tests
        uses: ./.github/actions/run-canonical-tests

  behavioral-testing:
    runs-on: ubuntu-latest
    name: Behavioral Testing
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build npm package
        run: |
          npm ci
          npm pack
          echo "PACKAGE_FILE=$(pwd)/$(ls mksetaro-patchani-*.tgz)" >> $GITHUB_ENV

      - name: Test patchani behavioral execution
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: openai  # Use OpenAI-compatible mode for LiteLLM
          model: mock-gpt-4o
          token: ${{ secrets.LITELLM_API_KEY }}
          base_url: ${{ secrets.LITELLM_BASE_URL }}  # Your LiteLLM server URL (secret, not variable)
          extensions: npm:@mksetaro/patchani@file:${{ env.PACKAGE_FILE }}
          prompt: |
            Create a file at /tmp/patchani-test.txt and write "WE WE SHUSHU" in it.
        env:
          TEST_MARKER_FILE: /tmp/patchani-test.txt

      - name: Verify behavioral test output
        run: |
          if [ ! -f "$TEST_MARKER_FILE" ]; then
            echo "❌ Test file not created - behavioral test failed"
            exit 1
          fi
          
          CONTENT=$(cat "$TEST_MARKER_FILE")
          if [ "$CONTENT" != "WE WE SHUSHU" ]; then
            echo "❌ Test file content incorrect: $CONTENT"
            exit 1
          fi
          
          echo "✅ Behavioral test passed: patchani executed successfully"
        env:
          TEST_MARKER_FILE: /tmp/patchani-test.txt

      - name: Verify patchani in settings
        run: |
          # Check settings
          cat ~/.pi/agent/settings.json
          
          # Verify package is listed
          if ! grep -q "patchani" ~/.pi/agent/settings.json; then
            echo "❌ Patchani not in settings"
            exit 1
          fi
          
          echo "✅ Patchani installed in settings"

      - name: Upload behavioral test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-test-logs
          path: |
            ~/.pi/agent/sessions/**/*.jsonl
            ~/.pi/agent/settings.json
          retention-days: 7
