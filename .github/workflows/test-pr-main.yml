name: PR to Main - Full Test Suite

on:
  pull_request:
    branches:
      - main

jobs:
  canonical-tests:
    runs-on: ubuntu-latest
    name: Canonical Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: '20'

      - name: Run canonical tests
        uses: ./.github/actions/run-canonical-tests
        with:
          summary-message: '✅ Canonical tests passed!'

  patchani-integration-test:
    runs-on: ubuntu-latest
    name: Patchani Integration Test
    needs: canonical-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test patchani installation and activation
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          provider: litellm
          model: mock-gpt-4o
          token: ${{ secrets.LITELLM_API_KEY }}
          base_url: ${{ vars.LITELLM_BASE_URL }}
          task: |
            # Install patchani from current directory
            pi install .
            
            # Test /help command
            /help
            
            # If we got here, patchani loaded successfully
            echo "✅ Patchani installed and /help executed successfully"

      - name: Verify patchani in settings
        run: |
          # Check settings
          cat ~/.pi/agent/settings.json
          
          # Verify package is listed
          if ! grep -q "patchani" ~/.pi/agent/settings.json; then
            echo "❌ Patchani not in settings"
            exit 1
          fi
          
          echo "✅ Patchani installed in settings"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchani-integration-logs
          path: |
            ~/.pi/agent/sessions/**/*.jsonl
            ~/.pi/agent/settings.json
          retention-days: 7

  test-summary:
    runs-on: ubuntu-latest
    name: Test Summary
    needs: [canonical-tests, patchani-integration-test]
    if: always()
    
    steps:
      - name: Report Results
        run: |
          echo ""
          echo "=================================="
          echo "  PR to Main - Test Suite Results"
          echo "=================================="
          echo ""
          echo "✓ Canonical Tests (unit + integration)"
          echo "✓ Patchani Integration (install + /help)"
          echo ""
          echo "✅ All test suites passed!"
          echo ""
          echo "Ready to merge to main."
